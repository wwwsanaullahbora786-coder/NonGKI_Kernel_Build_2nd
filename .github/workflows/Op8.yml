name: Build Oneplus 8 (OxygenOS 13.1 A13) (KernelSU)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-android-"
  # OOS 4.19.157 旧代码 + clang 19: 禁用新 clang 默认 -Werror 严格警告
  # KCFLAGS 值必须用引号包裹(含空格), 否则 make 只取第一个参数
  EXTRA_CMDS : 'KCFLAGS="-Wno-strict-prototypes -Wno-incompatible-function-pointer-types -Wno-deprecated-non-prototype -Wno-implicit-int -Wno-int-to-pointer-cast -Wno-pointer-to-int-cast -Wno-implicit-function-declaration -Wno-unused-but-set-variable"'

  # 自建完整内核仓库 (已将 vendor/devicetree + techpack 源码合并进内核树,
  # 不再需要单独克隆 vendor 仓库, 也不需要在 build 时解析 symlink)
  KERNEL_SOURCE : "https://github.com/TropsPk/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "complete-merge-oos-13.1-op8"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # backslashxx KernelSU (master 最新), 手动钩子来自 issue #5
  # (scope-minimized manual hooks, CONFIG_KSU 门控)
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "xxksu" # xxksu = backslashxx/KernelSU

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oos13.1_a13_ksu"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # 仅 KernelSU, 不启用其他集成
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  # OOS defconfig 已内嵌 oplus 配置, 无需额外 merge oplus.config
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 (OxygenOS 13.1 A13) (KernelSU)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools (clone kernel + setup KernelSU)
        uses: ./.github/workflows/build-ready

      - name: 📌 Kernel version suffix (self-contained fork)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # backslashxx KernelSU setup.sh 已注册 drivers/kernelsu (Makefile+Kconfig)
          # 这里仅设置自定义版本后缀
          echo "-g$(git rev-parse --short HEAD)-oos-ksu" > .scmversion
          echo "[+] .scmversion written."

      - name: 🪝 Apply KernelSU manual hooks (backslashxx issue #5, 4.19)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          cp /tmp/Patches/Patch/ksu_manual_hooks_4.19.patch ./
          patch -p1 < ksu_manual_hooks_4.19.patch || true
          rm -f ksu_manual_hooks_4.19.patch
          echo "[+] KernelSU manual hooks patched (exec/faccessat/newfstatat+ret/reboot)."

      - name: 📝 Apply KernelSU defconfig fragment
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          cp /tmp/Patches/Patch/defconfig_ksu.patch ./
          patch -p1 < defconfig_ksu.patch || true
          rm -f defconfig_ksu.patch
          echo "[+] KernelSU defconfig applied."

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🖼️ Generate DTB (concat kona dtb variants)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DTB_DIR="out/arch/arm64/boot/dts/vendor/19821"
          if [ -f "$DTB_DIR/kona-mtp.dtb" ]; then
            cat "$DTB_DIR/kona-mtp.dtb" > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img from kona-mtp.dtb"
          else
            # 回退: 拼接 vendor 下所有 dtb (与 OnePlus 官方 AndroidKernel.mk 一致)
            cat out/arch/arm64/boot/dts/vendor/*/*.dtb > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img (concat all vendor dtbs)"
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
